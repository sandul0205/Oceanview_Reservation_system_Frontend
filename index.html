<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login • Ocean View Resort</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./assets/styles.css"/>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="ov-brand mb-3">
        <div class="ov-logo">OV</div>
        <div>
          <div class="title">Ocean View Resort</div>
          <div class="subtitle">Room Reservation System</div>
        </div>
        <div class="ms-auto">
          <button class="btn btn-sm btn-outline-light" id="btnSettings" type="button">
            <i class="bi bi-gear"></i>
          </button>
        </div>
      </div>

      <div class="card ov-card">
        <div class="card-header">
          <div class="d-flex align-items-center justify-content-between">
            <div>
              <div class="fw-bold">Login</div>
              <div class="ov-small">Use your staff/admin username and password.</div>
            </div>
            <span class="badge badge-soft">Payara • REST</span>
          </div>
        </div>

        <div class="card-body">
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input class="form-control" id="username" autocomplete="username" placeholder="e.g., admin" required/>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input class="form-control" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required/>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary" id="btnLogin" type="submit">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
              </button>
            </div>

            <div class="mt-3 ov-small">
              API Base: <span id="apiBaseText"></span>
            </div>
          </form>
        </div>
      </div>

      <div class="ov-small mt-3">
        Tip: If you're running frontend separately (Live Server), backend CORS is already enabled.
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content ov-card">
      <div class="modal-header">
        <h5 class="modal-title">Settings</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">API Base URL</label>
        <input class="form-control" id="apiBaseInput" placeholder="http://localhost:8080/oceanview-backend/api"/>
        <div class="ov-small mt-2">
          Keep it like: <code>http://localhost:8080/oceanview-backend/api</code>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-light" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-primary" id="btnSaveApi">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- App -->
<script type="module" src="./js/login.js"></script>
</body>
</html>
